name: he_thong_kho_luu_tru_tri_thuc

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eduvault}
      MYSQL_USER: ${MYSQL_USER:-eduvault}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=512M
      - --binlog-expire-logs-seconds=604800
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "9001:9001"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333; exec 3>&-'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_PROVIDER: mysql
      DATABASE_FALLBACK_SQLITE: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      QDRANT_ENABLED: "true"
      QDRANT_URL: http://qdrant:6333
      MYSQL_CONNECT_TIMEOUT_SECONDS: ${MYSQL_CONNECT_TIMEOUT_SECONDS:-3}
      MYSQL_STARTUP_MAX_WAIT_SECONDS: ${MYSQL_STARTUP_MAX_WAIT_SECONDS:-45}
      MYSQL_STARTUP_BACKOFF_BASE_SECONDS: ${MYSQL_STARTUP_BACKOFF_BASE_SECONDS:-0.5}
      MYSQL_STARTUP_BACKOFF_MAX_SECONDS: ${MYSQL_STARTUP_BACKOFF_MAX_SECONDS:-5}
    volumes:
      - app_data:/app/data/mvp
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 75s
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  minio_data:
  redis_data:
  qdrant_data:
  app_data:

