protocol: http2
tunnel: __CLOUDFLARE_TUNNEL_ID__
credentials-file: __CLOUDFLARE_CREDENTIALS_FILE__

ingress:
  - hostname: __CLOUDFLARE_FRONTEND_HOSTNAME__
    service: http://127.0.0.1:__FRONTEND_PORT__
  - hostname: __CLOUDFLARE_BACKEND_HOSTNAME__
    service: http://127.0.0.1:__BACKEND_PORT__
  - hostname: __CLOUDFLARE_FRONTEND_HOSTNAME_ALT__
    service: http://127.0.0.1:__FRONTEND_PORT__
  - hostname: __CLOUDFLARE_BACKEND_HOSTNAME_ALT__
    service: http://127.0.0.1:__BACKEND_PORT__
  - service: http_status:404
