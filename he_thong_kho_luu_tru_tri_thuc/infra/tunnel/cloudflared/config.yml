protocol: http2
tunnel: ${CLOUDFLARE_TUNNEL_ID}
credentials-file: ${CLOUDFLARE_CREDENTIALS_FILE}

ingress:
  - hostname: ${CLOUDFLARE_FRONTEND_HOSTNAME}
    service: http://127.0.0.1:${FRONTEND_PORT:-3000}
  - hostname: ${CLOUDFLARE_BACKEND_HOSTNAME}
    service: http://127.0.0.1:${BACKEND_PORT:-8080}
  - hostname: ${CLOUDFLARE_FRONTEND_HOSTNAME_ALT}
    service: http://127.0.0.1:${FRONTEND_PORT:-3000}
  - hostname: ${CLOUDFLARE_BACKEND_HOSTNAME_ALT}
    service: http://127.0.0.1:${BACKEND_PORT:-8080}
  - service: http_status:404
